# hpa-comparison.yaml
# Standard Kubernetes Horizontal Pod Autoscaler for cpu-load-app.
# Deploy this alongside the ML autoscaler to compare reactive HPA
# vs. predictive ML autoscaling.
#
# Usage:
#   kubectl apply -f kubernetes/hpa-comparison.yaml
#
# To remove after comparison:
#   kubectl delete -f kubernetes/hpa-comparison.yaml

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cpu-load-app-hpa
  namespace: ai-scaler
  labels:
    component: hpa-comparison
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cpu-load-app
  minReplicas: 1
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0       # React immediately on scale-up
      policies:
      - type: Pods
        value: 2
        periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 300     # Wait 5 min before scaling down
      policies:
      - type: Pods
        value: 1
        periodSeconds: 60
