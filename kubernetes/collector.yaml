apiVersion: v1
kind: ServiceAccount
metadata:
  name: cpu-collector-sa
  namespace: ai-scaler
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cpu-collector-role
rules:
- apiGroups: [""]
  resources: ["nodes", "nodes/proxy", "pods"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["metrics.k8s.io"]
  resources: ["pods"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cpu-collector-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cpu-collector-role
subjects:
- kind: ServiceAccount
  name: cpu-collector-sa
  namespace: ai-scaler
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cpu-collector
  namespace: ai-scaler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cpu-collector
  template:
    metadata:
      labels:
        app: cpu-collector
    spec:
      serviceAccountName: cpu-collector-sa
      containers:
      - name: cpu-collector
        image: cpu-collector:v1
        imagePullPolicy: IfNotPresent
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: SIMULATE_MODE
          value: "false"
        ports:
        - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: cpu-collector
  namespace: ai-scaler
spec:
  selector:
    app: cpu-collector
  ports:
  - port: 8000
    targetPort: 8000
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cpu-collector-metrics-reader
rules:
- apiGroups: ["metrics.k8s.io"]
  resources: ["pods"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cpu-collector-metrics-reader-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cpu-collector-metrics-reader
subjects:
- kind: ServiceAccount
  name: cpu-collector-sa
  namespace: ai-scaler
