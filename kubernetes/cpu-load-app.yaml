apiVersion: apps/v1
kind: Deployment
metadata:
  name: cpu-load-app
  namespace: ai-scaler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cpu-load-app
  template:
    metadata:
      labels:
        app: cpu-load-app
    spec:
      containers:
      - name: cpu-load-app
        image: cpu-load-app:v1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "1000m"
            memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: cpu-load-app
  namespace: ai-scaler
spec:
  selector:
    app: cpu-load-app
  ports:
  - port: 8000
    targetPort: 8000
