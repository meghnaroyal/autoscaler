# loadgen-k6-burst.yaml
#
# Runs the k6 bursty load test inside the cluster as a Kubernetes Job.
# The k6 script is mounted from a ConfigMap so it stays version-controlled
# alongside the rest of the load-generator manifests.
#
# Experiment workflow
# -------------------
# Run A — HPA only (no GRU autoscaler):
#   kubectl apply  -f kubernetes/hpa-comparison.yaml
#   kubectl delete -f kubernetes/autoscaler-deployment.yaml --ignore-not-found
#   kubectl delete job k6-burst-loadgen -n ai-scaler --ignore-not-found
#   kubectl apply  -f kubernetes/loadgen-k6-burst.yaml
#   # Watch replica count:
#   kubectl get hpa cpu-load-app-hpa -n ai-scaler -w
#   kubectl logs -f job/k6-burst-loadgen -n ai-scaler
#
# Run B — GRU autoscaler only (no HPA):
#   kubectl delete -f kubernetes/hpa-comparison.yaml --ignore-not-found
#   kubectl apply  -f kubernetes/autoscaler-deployment.yaml
#   kubectl delete job k6-burst-loadgen -n ai-scaler --ignore-not-found
#   kubectl apply  -f kubernetes/loadgen-k6-burst.yaml
#   # Watch replica count:
#   kubectl get deployment cpu-load-app -n ai-scaler -w
#   kubectl logs -f job/k6-burst-loadgen -n ai-scaler
#
# Compare replica timelines from both runs to see which autoscaler
# reacted faster during spikes and scaled down sooner after drops.
#
# Cleanup:
#   kubectl delete -f kubernetes/loadgen-k6-burst.yaml

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: k6-burst-script
  namespace: ai-scaler
data:
  k6-burst-test.js: |
    import http from 'k6/http';
    import { sleep, check } from 'k6';

    const BASE_URL = __ENV.BASE_URL || 'http://cpu-load-app.ai-scaler:8000';

    export const options = {
      stages: [
        { duration: '30s', target: 20  },
        { duration: '5s',  target: 300 },
        { duration: '60s', target: 300 },
        { duration: '5s',  target: 5   },
        { duration: '60s', target: 20  },
        { duration: '5s',  target: 300 },
        { duration: '60s', target: 300 },
        { duration: '5s',  target: 5   },
        { duration: '30s', target: 20  },
      ],
      thresholds: {
        http_req_failed: ['rate<0.10'],
      },
    };

    export default function () {
      const res = http.get(`${BASE_URL}/work?iterations=5000000`);
      check(res, { 'status 200': (r) => r.status === 200 });
    }

---
apiVersion: batch/v1
kind: Job
metadata:
  name: k6-burst-loadgen
  namespace: ai-scaler
  labels:
    component: loadgen
    test: burst
spec:
  # Do not retry — a failed run means the cluster was severely under-provisioned;
  # rerunning would pollute the comparison baseline.
  backoffLimit: 0
  template:
    metadata:
      labels:
        component: loadgen
        test: burst
    spec:
      restartPolicy: Never
      containers:
      - name: k6
        image: grafana/k6:0.55.0
        args:
          - run
          - /scripts/k6-burst-test.js
        env:
        - name: BASE_URL
          value: "http://cpu-load-app.ai-scaler:8000"
        volumeMounts:
        - name: script
          mountPath: /scripts
        resources:
          requests:
            cpu: "200m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
      volumes:
      - name: script
        configMap:
          name: k6-burst-script
